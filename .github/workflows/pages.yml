name: Deploy Anvi Electrical Website

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare GitHub Pages SEO URLs
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          site_url = f"https://{os.environ['GITHUB_REPOSITORY_OWNER']}.github.io/{os.environ['GITHUB_REPOSITORY'].split('/',1)[1]}"

          p = Path("index.html")
          s = p.read_text()
          s = s.replace('<link rel="canonical" href="./">', f'<link rel="canonical" href="{site_url}/">')
          s = s.replace('<meta property="og:image" content="./assets/images/anvi-og.svg">', f'<meta property="og:url" content="{site_url}/">\n  <meta property="og:image" content="{site_url}/assets/images/anvi-og.svg">')
          s = s.replace('<meta name="twitter:image" content="./assets/images/anvi-og.svg">', f'<meta name="twitter:image" content="{site_url}/assets/images/anvi-og.svg">')
          p.write_text(s)

          p = Path("robots.txt")
          p.write_text(p.read_text().replace("__SITE_URL__", site_url))

          p = Path("sitemap.xml")
          p.write_text(p.read_text().replace("__SITE_URL__", site_url))
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
